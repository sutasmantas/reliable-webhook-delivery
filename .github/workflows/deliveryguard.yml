name: DeliveryGuard

on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --group dev
      - run: uv run ruff check deliveryguard scripts/check_consumer_freshness.py tests/test_deliveryguard.py tests/test_consumer_freshness.py
      - run: uv run ruff format --check deliveryguard scripts/check_consumer_freshness.py tests/test_deliveryguard.py tests/test_consumer_freshness.py
      - run: uv run mypy deliveryguard
      - run: uv run pytest tests/test_deliveryguard.py tests/test_consumer_freshness.py
      - run: uv build
      - run: uv run deliveryguard demo --database .demo/delivery.sqlite3
