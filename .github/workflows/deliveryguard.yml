name: DeliveryGuard

on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv sync --group dev
      - run: uv run ruff check deliveryguard tests/test_deliveryguard.py
      - run: uv run ruff format --check deliveryguard tests/test_deliveryguard.py
      - run: uv run mypy deliveryguard
      - run: uv run pytest tests/test_deliveryguard.py
      - run: uv build
      - run: uv run deliveryguard demo --database .demo/delivery.sqlite3
