name: Pages

on:
  push:
    branches: [main]
    paths:
      - "deliveryguard/viewer/**"
      - "deliveryguard/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate a fresh delivery lifecycle
        run: |
          python -m pip install -e .
          python -m deliveryguard.cli demo --database /tmp/deliveryguard-pages.sqlite3 > /tmp/delivery-run.json
      - name: Assemble static recovery console
        run: |
          mkdir -p _site
          cp deliveryguard/viewer/index.html _site/index.html
          cp deliveryguard/viewer/app.js _site/app.js
          cp deliveryguard/viewer/styles.css _site/styles.css
          cp /tmp/delivery-run.json _site/delivery-run.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
